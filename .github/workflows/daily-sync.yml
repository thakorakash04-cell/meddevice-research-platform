name: Daily CDSCO Data Sync

on:
  schedule:
    # Runs at 02:00 UTC (07:30 AM IST) every single day
    - cron: '0 2 * * *'
  # manual triggers
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 "urllib3<2.0.0" openpyxl pyarrow orjson

      - name: Run Fetcher Script
        run: |
          python update_cdsco_data.py

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          echo "changes=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit and Push Data
        if: steps.git-check.outputs.changes > 0
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cdsco_*.parquet cdsco_*.xlsx cdsco_metadata.json
          git commit -m "Automated Daily CDSCO Sync: $(date -u) [skip ci]"
          git push
